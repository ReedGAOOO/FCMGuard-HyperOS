plugins {
    id 'com.android.application'
}

// Release signing comes from the environment (CI writes the keystore from a repository
// secret). Without it, assembleRelease still works locally and produces an unsigned APK.
def releaseKeystore = System.getenv('ALOFCM_KEYSTORE_FILE')

android {
    namespace 'com.alofcm'
    compileSdk 35

    defaultConfig {
        applicationId "com.alofcm.originos"
        minSdk 21
        targetSdk 34
        versionCode 39
        versionName "2.0.7-originos"
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ALOFCM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ALOFCM_KEY_ALIAS')
                keyPassword System.getenv('ALOFCM_KEY_PASSWORD') ?: System.getenv('ALOFCM_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Not debuggable, R8-optimized and resource-shrunk.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // Distributed outside Google Play; Play's yearly targetSdk deadline does not apply.
        disable.add('ExpiredTargetSdkVersion')
        disable.add('OldTargetApi')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
