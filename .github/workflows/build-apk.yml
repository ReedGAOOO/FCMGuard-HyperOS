name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish this build as a GitHub pre-release (never becomes Latest)'
        type: boolean
        default: false
      ui_screenshots:
        description: 'Also capture UI screenshots on an Android emulator'
        type: boolean
        default: false
      record_demos:
        description: 'Also record the README demo clips on an Android emulator'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRET: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check responsive layout profiles
        run: python3 tools/check_layout_profiles.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") fails on current runners:
          # the legacy "tools" package no longer exists in the SDK repository.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Release signing. Preferred source: repository secrets (see README, "Release
      # signing"). The key that older releases were signed with lived only in the Actions
      # cache; it is restored read-only as a fallback and never re-saved.
      - name: Restore legacy CI signing key
        if: env.HAS_SIGNING_SECRET != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ci-signing
          key: fcmguard-stable-ci-signing-v1

      - name: Prepare signing key
        id: signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE="$RUNNER_TEMP/signing/release.keystore"

          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            STORE_PASS="$SIGNING_KEYSTORE_PASSWORD"
            ALIAS="$SIGNING_KEY_ALIAS"
            KEY_PASS="${SIGNING_KEY_PASSWORD:-$SIGNING_KEYSTORE_PASSWORD}"
            SOURCE=secret
          elif [ -f ci-signing/fcmguard-debug.keystore ]; then
            cp ci-signing/fcmguard-debug.keystore "$KEYSTORE"
            STORE_PASS=android
            ALIAS=fcmguarddebug
            KEY_PASS=android
            SOURCE=legacy-cache
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::No release signing key. Add the SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD and SIGNING_KEY_ALIAS repository secrets (README: Release signing). Refusing to publish a release signed with a throwaway key, because users could not upgrade over it."
            exit 1
          else
            # Branch builds without secrets: throwaway key, test artifacts only.
            STORE_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$STORE_PASS"
            ALIAS=fcmguard-ephemeral
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=FCM Guard ephemeral CI key" >/dev/null
            SOURCE=ephemeral
          fi

          {
            echo "FCMGUARD_KEYSTORE_FILE=$KEYSTORE"
            echo "FCMGUARD_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "FCMGUARD_KEY_ALIAS=$ALIAS"
            echo "FCMGUARD_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Signing key source: $SOURCE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Read version and prepare release APKs
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          APK_NAME="FCMGuard-HyperOS-${TAG}.apk"
          LATEST_APK_NAME="FCMGuard-HyperOS.apk"
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "$APK_NAME"
          cp "$APK" "$LATEST_APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "latest_apk_name=$LATEST_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCMGuard-apk
          path: ${{ steps.version.outputs.apk_name }}
          retention-days: 30

      # Manual test channel: publishes vX.Y.Z as a pre-release from any branch. GitHub never
      # treats a pre-release as Latest, so releases/latest/download/... keeps serving the
      # current stable APK. Re-running replaces the pre-release (tag moves to this commit).
      - name: Publish APK as GitHub pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          SIGNING_SOURCE: ${{ steps.signing.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
              echo "::error::$TAG is already a stable release; refusing to replace it with a pre-release."
              exit 1
            fi
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          if [ "$SIGNING_SOURCE" = "ephemeral" ]; then
            SIGNING_NOTE="⚠️ Signed with a temporary CI key: uninstall the installed FCM Guard before installing, and reinstall again for the final v${VERSION}. / 使用临时密钥签名：安装前需先卸载已安装的 FCM Guard，正式版发布后需再重装一次。"
          else
            SIGNING_NOTE="Signed with the release key; the final v${VERSION} installs over it. / 使用正式密钥签名，正式版可直接覆盖安装。"
          fi
          NOTES="Pre-release for testing. The stable release stays on the current Latest version until this build is promoted.
          测试版：在转为正式版之前，稳定版仍为当前的 Latest 版本。

          ${SIGNING_NOTE}

          Commit: ${GITHUB_SHA}"

          gh release create "$TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "FCM Guard v${VERSION} (Pre-release)" \
            --notes "$NOTES"

      # Feature branches validate the APK; only main publishes or refreshes stable Releases.
      - name: Publish APKs to GitHub Release
        if: github.ref == 'refs/heads/main' && !inputs.publish_prerelease && steps.signing.outputs.source != 'ephemeral'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          LATEST_APK_NAME: ${{ steps.version.outputs.latest_apk_name }}
        shell: bash
        run: |
          # Promotion: a pre-release of this version is replaced by the stable build so the
          # tag points at main and the release can become Latest.
          if gh release view "$TAG" >/dev/null 2>&1 &&
              [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A published stable release is never rebuilt in place (users may have checked
            # its APK, and README-only changes would otherwise replace it). New changes ship
            # under a new versionName.
            echo "::notice::$TAG is already released; its APKs are left as they are. Bump versionName to publish a new release."
          else
            # Release notes come from docs/releases/<tag>.md when present.
            NOTES_FILE="docs/releases/${TAG}.md"
            if [ -f "$NOTES_FILE" ]; then
              NOTES_ARGS=(--notes-file "$NOTES_FILE")
            else
              NOTES_ARGS=(--notes "FCM Guard v${VERSION} for China-ROM HyperOS 3. Download the APK below and install it directly on your phone.")
            fi
            gh release create "$TAG" "$APK_NAME" "$LATEST_APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "FCM Guard v${VERSION}" \
              "${NOTES_ARGS[@]}"
          fi

  ui-screenshots:
    if: github.event_name == 'workflow_dispatch' && (inputs.ui_screenshots || inputs.record_demos)
    uses: ./.github/workflows/ui-screenshots.yml
    with:
      passes: ${{ format('{0} {1}', inputs.ui_screenshots && 'shots' || '', inputs.record_demos && 'demos' || '') }}
