name: Build APK

on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check responsive layout profiles
        run: python3 tools/check_layout_profiles.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable CI signing key
        uses: actions/cache@v4
        with:
          path: ci-signing
          key: fcmguard-stable-ci-signing-v1

      - name: Create stable CI signing key if missing
        run: |
          mkdir -p ci-signing
          if [ ! -f ci-signing/fcmguard-debug.keystore ]; then
            keytool -genkeypair \
              -keystore ci-signing/fcmguard-debug.keystore \
              -storepass android \
              -keypass android \
              -alias fcmguarddebug \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FCM Guard Debug,O=ReedGAOOO,C=SG"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Read version and prepare release APKs
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          APK_NAME="FCMGuard-HyperOS-${TAG}.apk"
          LATEST_APK_NAME="FCMGuard-HyperOS.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$LATEST_APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "latest_apk_name=$LATEST_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCMGuard-debug-apk
          path: ${{ steps.version.outputs.apk_name }}
          retention-days: 30

      # Feature branches validate the APK; only main publishes or refreshes Releases.
      - name: Publish APKs to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          LATEST_APK_NAME: ${{ steps.version.outputs.latest_apk_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" "$LATEST_APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" "$LATEST_APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "FCM Guard v${VERSION}" \
              --notes "FCM Guard v${VERSION} for China-ROM HyperOS 3. Download the APK below and install it directly on your phone."
          fi
